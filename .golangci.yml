version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nakedret
    - prealloc
    - unconvert
    - unparam
  settings:
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam
      - path: examples/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
